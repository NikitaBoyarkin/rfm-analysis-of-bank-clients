[project]
name = "rfm-analysis-of-bank-clients"
version = "1.0.0"
description = "RFM segmentation of bank clients from transaction data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nikita Boyarkin" }]
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "openpyxl>=3.1,<4.0",
    "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
jupyter = ["jupyter>=1.0,<2.0", "ipykernel>=6.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=4.0"]
dashboard = ["streamlit>=1.30,<2.0"]

[tool.ruff]
line-length = 100
exclude = ["notebooks/*.ipynb", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
